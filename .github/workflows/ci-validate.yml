name: CI - Validate Terraform & Ansible

on:
  pull_request:
    branches: [ "main" ]  

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify AWS Secrets Present
      run: |
        if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
          echo "ERROR: AWS_ACCESS_KEY_ID is missing or empty"
          exit 1
        fi
        if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
          echo "ERROR: AWS_SECRET_ACCESS_KEY is missing or empty"
          exit 1
        fi

    # AWS Authentication (Needed for Terraform Plan)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      working-directory: ./terraform
      run: terraform fmt -check
      
    # Validate Terraform
    - name: Terraform Validate
      working-directory: ./terraform
      run: terraform validate
    
    # Generates an execution plan for Terraform
    - name: Terraform Plan
      working-directory: ./terraform
      run: terraform plan -input=false

    # Install Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Install Ansible
    - name: Install Ansible
      run: |
        pip install ansible ansible-lint boto3 botocore
        ansible-galaxy collection install amazon.aws

    # Ansible Syntax Check
    - name: Ansible Syntax Check
      working-directory: ./ansible
      run: ansible-playbook site.yml --syntax-check

    # Ansible Lint Check
    - name: Ansible Lint Check
      working-directory: ./ansible
      run: ansible-lint site.yml
