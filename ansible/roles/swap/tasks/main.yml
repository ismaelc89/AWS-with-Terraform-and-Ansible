---
- name: Check if swap exists
  ansible.builtin.stat:
    path: /swapfile
  register: swap_file_stat

- name: Allocate 2Gb swap file
  ansible.builtin.command:
    cmd: dd if=/dev/zero of=/swapfile bs=128M count=16
  when: not swap_file_stat.stat.exists
  changed_when: true

- name: Set correct permissions on file
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: '0660'

- name: Set up swap area
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swap_file_stat.stat.exists
  changed_when: true

- name: Enble swap space
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: ansible_swaptotal_mb == 0
  changed_when: true

- name: Make swap permanent in fstab
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    passno: '0'
    dump: '0'
    state: present
