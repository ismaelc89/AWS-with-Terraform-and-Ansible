---
- name: Ensure app directory exists
  ansible.builtin.file:
    path: /home/ec2-user/app
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Copy Template index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /home/ec2-user/app/index.html
    owner: ec2-user
    group: ec2-user
    mode: '0644'

- name: Start python httpd
  ansible.builtin.shell:
    cmd: nohup python3 -m http.server 8080 > app.log 2>&1 &
    chdir: /home/ec2-user/app
    creates: /home/ec2-user/app/app.log
  become: false
